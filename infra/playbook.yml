---
# Provisions the droplet that serves ryankennedy.me.
#
# The site is a static Astro build, so the server runs nginx and nothing
# else: no Node, no application runtime. That is why this playbook is short
# enough to read in one sitting, and why rebuilding the server is cheap.
#
#   ansible-playbook -i inventory.ini playbook.yml --check   # dry run
#   ansible-playbook -i inventory.ini playbook.yml
#
# Idempotent: safe to re-run after changing the nginx config.
# Ported from downtown-foot-clinic/infra, which has the same shape.

- name: Provision the ryankennedy.me web server
  hosts: web
  become: true

  vars:
    site_domain: ryankennedy.me
    web_root: /var/www/ryankennedy.me
    admin_user: ryan
    # Ryan's personal key. Also injected at first boot via cloud-init so the
    # very first Ansible run can connect as root.
    admin_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAdG6DcSKx7FZiqHydLy+Q7gSyYzmn8cuvqCfRe+qTzN admin@ryankennedy.dev"
    deploy_user: deploy
    # Public half of the GitHub Actions deploy key. The private half lives
    # only in the repository's `production` environment secrets.
    deploy_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHhdWR3amSbLQtlpgpTw4UycFACw5oIdmKtqV34PDhRl github-actions-rkme"
    # false -> plain HTTP vhost, so the box can be verified over its raw IP
    #          before DNS moves and before a certificate exists
    # true  -> the full TLS vhost (run this after the cert is issued)
    enable_ssl: false

  tasks:
    # ---------------------------------------------------------------- packages
    - name: Update apt cache and upgrade everything
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install what the server needs
      ansible.builtin.apt:
        name:
          - nginx
          - ufw
          - fail2ban
          - unattended-upgrades
          - rsync          # the deploy workflow uploads with it
          - certbot
          - python3-certbot-dns-digitalocean
        state: present

    # ------------------------------------------------- automatic updates
    # Defaults only take the security pocket and never reboot, so kernel
    # updates install but never take effect. Rebooting is safe here because
    # the server is stateless: nginx serves files off disk and starts on boot.
    - name: Configure unattended-upgrades to include updates and reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}:${distro_codename}-updates";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:30";
      notify: Restart unattended-upgrades

    - name: Enable the periodic apt timers
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    # ------------------------------------------------------------ admin user
    # Must exist, with sudo and a working key, *before* root login is
    # disabled, or the hardening step locks everyone out.
    - name: Create the admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Install the admin public key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_pubkey }}"
        state: present

    - name: Passwordless sudo for the admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        mode: "0440"
        validate: "visudo -cf %s"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"

    # Prove the admin account works before taking root away. If this fails,
    # the play stops here with root login still enabled.
    - name: Verify the admin user can log in and use sudo
      ansible.builtin.command: >-
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -i {{ admin_key_path | default('~/.ssh/id_ed25519') }}
            {{ admin_user }}@{{ ansible_host }} sudo -n true
      delegate_to: localhost
      become: false
      changed_when: false

    # ------------------------------------------------------------- ssh
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          MaxAuthTries 3
      notify: Restart ssh

    # Handlers only fire if the play reaches the end. Apply now, so a run
    # that fails later never leaves the file on disk but unapplied.
    - name: Apply the sshd change immediately
      ansible.builtin.meta: flush_handlers

    # Assert against the running daemon, not the file. Reading `sshd -T`
    # costs nothing and, unlike a real failed root login, bans no one.
    - name: Read the running sshd configuration
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    - name: Verify root login and password auth are actually disabled
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_effective.stdout"
          - "'passwordauthentication no' in sshd_effective.stdout"
        fail_msg: >-
          sshd is still accepting root or password logins. The hardening file
          is probably on disk but was never applied; check that the restart
          handler ran.
        success_msg: "sshd refuses root and password logins"

    # ------------------------------------------------------------ firewall
    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow ssh and web
      community.general.ufw:
        rule: allow
        name: "{{ item }}"
      loop:
        - OpenSSH
        - Nginx Full

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Enable fail2ban for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          maxretry = 5
          bantime = 1h
          ignoreip = 127.0.0.1/8 ::1
      notify: Restart fail2ban

    # -------------------------------------------------------- deploy user
    # Unprivileged, owns only the web root. GitHub Actions authenticates as
    # this user; it cannot touch anything else on the box.
    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true

    - name: Install the deploy public key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_pubkey }}"
        state: present

    - name: Create the release layout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - "{{ web_root }}"
        - "{{ web_root }}/releases"
        - "{{ web_root }}/releases/placeholder"
        - /var/www/certbot

    # A placeholder release means nginx has something to serve, and a valid
    # `current` symlink, before the first deploy runs.
    - name: Seed a placeholder release
      ansible.builtin.copy:
        dest: "{{ web_root }}/releases/placeholder/index.html"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"
        force: false
        content: |
          <!doctype html>
          <meta charset="utf-8">
          <title>ryankennedy.me</title>
          <p>Awaiting first deploy.</p>

    # `force: false` does not protect an existing symlink: Ansible repoints
    # it silently. Check first, and only create the link when nothing is
    # there, so a re-run never puts the placeholder in front of live traffic.
    - name: Check whether current already points at a release
      ansible.builtin.stat:
        path: "{{ web_root }}/current"
      register: current_link

    - name: Point current at the placeholder, but only if it is unset
      ansible.builtin.file:
        src: "{{ web_root }}/releases/placeholder"
        dest: "{{ web_root }}/current"
        state: link
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
      when: not current_link.stat.exists

    # ------------------------------------------------------------- nginx
    - name: Remove the default vhost
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Install the shared TLS snippet
      ansible.builtin.copy:
        src: files/tls-snippet.conf
        dest: /etc/nginx/snippets/ryankennedy-tls.conf
        mode: "0644"
      notify: Reload nginx

    - name: Install the security headers snippet
      ansible.builtin.copy:
        src: files/headers-snippet.conf
        dest: /etc/nginx/snippets/ryankennedy-headers.conf
        mode: "0644"
      notify: Reload nginx

    - name: Install the site vhost
      ansible.builtin.copy:
        src: "files/{{ 'nginx-site.conf' if enable_ssl | bool else 'nginx-site-http.conf' }}"
        dest: "/etc/nginx/sites-available/{{ site_domain }}"
        mode: "0644"
      notify: Reload nginx

    - name: Enable the site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ site_domain }}"
        dest: "/etc/nginx/sites-enabled/{{ site_domain }}"
        state: link
      notify: Reload nginx

    - name: Check the nginx config parses
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: nginx must be running and start on boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart unattended-upgrades
      ansible.builtin.service:
        name: unattended-upgrades
        state: restarted

    # Validate before reloading: a bad config would otherwise take the site
    # down until someone noticed.
    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx
      changed_when: true
