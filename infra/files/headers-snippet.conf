# Security headers. nginx does not inherit add_header into a location that
# sets its own, so this snippet is included at server level AND in every
# location that adds a header of its own (caching rules).
#
# HSTS starts at one week, no preload. Raise to a year once a renewal has
# been observed to work; HSTS cannot be withdrawn from browsers that cached it.
add_header Strict-Transport-Security "max-age=604800" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy, enforcing since 2026-10-09 after a clean
# report-only pass over every page type. The only third parties
# are the Web3Forms client and hCaptcha on the contact page; fonts are
# self-hosted by Astro. Astro and the theme script emit inline scripts and
# styles, hence 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://web3forms.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data:; font-src 'self'; frame-src https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://api.web3forms.com https://hcaptcha.com https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'" always;
