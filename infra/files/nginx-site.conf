# ryankennedy.me — static site.
#
# Astro builds to plain files; nginx serves them straight off disk through
# the `current` symlink, which the deploy workflow re-points at a new release
# directory. No application server, nothing to restart.

# --- canonical host ---------------------------------------------------------
# Everything redirects to the apex over HTTPS. The apex is what the sitemap,
# the canonical tags and the RSS feed use, so www and plain HTTP are
# redirects rather than alternative homes for the same pages.

server {
    listen 80;
    listen [::]:80;
    server_name ryankennedy.me www.ryankennedy.me;

    # Let certbot answer HTTP-01 renewals without being redirected away.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://ryankennedy.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ryankennedy.me;

    ssl_certificate     /etc/letsencrypt/live/ryankennedy.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ryankennedy.me/privkey.pem;
    include /etc/nginx/snippets/ryankennedy-tls.conf;

    return 301 https://ryankennedy.me$request_uri;
}

# --- the site ---------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ryankennedy.me;

    root /var/www/ryankennedy.me/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ryankennedy.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ryankennedy.me/privkey.pem;
    include /etc/nginx/snippets/ryankennedy-tls.conf;

    # --- security headers ---
    # HSTS starts at one week, no preload. Raise to a year once a renewal has
    # been observed to work; HSTS cannot be withdrawn from browsers that
    # cached it.
    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy, report-only: the browser evaluates it and logs
    # what it would have blocked to the console, blocking nothing. Switch to
    # enforcing once the console is clean on every page.
    #
    # Third parties are confined to the contact page: the Web3Forms client
    # script and the hCaptcha widget it loads. Fonts are self-hosted by
    # Astro, so no font CDN. Astro and the theme script emit inline scripts
    # and styles, hence 'unsafe-inline'.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://web3forms.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data:; font-src 'self'; frame-src https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://api.web3forms.com https://hcaptcha.com https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'" always;

    # --- compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    # woff2 is already compressed; re-compressing wastes CPU for nothing.

    # --- caching ---
    # Astro writes content hashes into /_astro/ filenames (scripts, styles,
    # fonts, optimised images), so they can never go stale.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # HTML must revalidate, or a deploy would not reach anyone holding a
    # cached copy.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /rss.xml {
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/rss+xml;
    }

    # --- routing ---
    # Astro writes /about/index.html, so bare paths resolve through $uri/.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Nothing here should ever be fetched over the network.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
