# Pre-certificate vhost.
#
# nginx will not start if a vhost points at certificate files that do not
# exist yet, and the certificate cannot be issued over HTTP-01 until DNS
# points at this droplet, which is the last step of the cutover, not the
# first. So the box comes up serving plain HTTP: enough to verify the whole
# site over the raw IP before any live traffic moves, with a webroot for
# ACME challenges.
#
# Replaced by nginx-site.conf once the certificate exists
# (ansible-playbook … -e enable_ssl=true).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ryankennedy.me www.ryankennedy.me _;

    root /var/www/ryankennedy.me/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # Astro writes /about/index.html, so bare paths resolve through $uri/.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
