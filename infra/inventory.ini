# The droplet that serves ryankennedy.me (rkme-web-sfo3-01, DigitalOcean sfo3).
#
# The playbook creates an admin user (ryan) with sudo and disables root SSH,
# so it connects as that user and escalates. For the very first run on a
# fresh droplet, where only root has a key, override on the command line:
#
#   ansible-playbook -i inventory.ini playbook.yml -e ansible_user=root
#
#   ansible-playbook -i inventory.ini playbook.yml --check    # dry run
#   ansible-playbook -i inventory.ini playbook.yml

[web]
rkme ansible_host=134.199.142.59

[web:vars]
ansible_user=ryan
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
