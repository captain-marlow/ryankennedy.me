name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, build, sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # rehype-mermaid renders diagrams through a headless Chromium at build
      # time. Cache the browser by Playwright version so most runs skip the
      # ~150 MB download.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium for Mermaid
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      # Guards the things that would silently break the site rather than
      # fail the build: a missing route, a page with no content, a draft
      # that leaked, a diagram that fell back to raw text.
      - name: Sanity-check the build output
        run: |
          set -euo pipefail
          fail=0
          for page in index.html 404.html notes/index.html articles/index.html contact/index.html; do
            f="dist/$page"
            if [ ! -f "$f" ]; then echo "::error::$f missing"; fail=1; continue; fi
            grep -q '<h1' "$f"          || { echo "::error::$f has no <h1>"; fail=1; }
            grep -q 'Ryan Kennedy' "$f" || { echo "::error::$f is missing the site name"; fail=1; }
            echo "ok  $f  ($(wc -c < "$f") bytes)"
          done
          [ -f dist/rss.xml ]           || { echo "::error::rss.xml missing"; fail=1; }
          [ -f dist/sitemap-index.xml ] || { echo "::error::sitemap-index.xml missing"; fail=1; }

          # Every published article and note must have rendered.
          for src in content/articles/*/index.md content/articles/*.md content/notes/*.md; do
            [ -f "$src" ] || continue
            if grep -qE '^draft: *true' "$src"; then
              title=$(grep -m1 '^title:' "$src" | sed 's/^title: *//; s/^"//; s/"$//')
              if grep -rqF -- "$title" dist --include='*.html'; then
                echo "::error::draft leaked into the build: $src"; fail=1
              fi
              continue
            fi
            case "$src" in
              content/articles/*/index.md) slug=$(basename "$(dirname "$src")"); out="dist/articles/$slug/index.html" ;;
              content/articles/*.md)       slug=$(basename "$src" .md);           out="dist/articles/$slug/index.html" ;;
              content/notes/*.md)          slug=$(basename "$src" .md);           out="dist/notes/$slug/index.html" ;;
            esac
            [ -f "$out" ] || { echo "::error::$src did not produce $out"; fail=1; continue; }
            # A mermaid fence must have become an SVG, never a raw code block.
            if grep -q '^```mermaid' "$src" && ! grep -q 'aria-roledescription' "$out"; then
              echo "::error::$out has a mermaid block that did not render"; fail=1
            fi
          done

          if grep -rq 'localhost' dist --include='*.html'; then
            echo "::error::a built page references localhost"; fail=1
          fi

          echo "pages: $(find dist -name '*.html' | wc -l), size: $(du -sh dist | cut -f1)"
          exit $fail

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3
